<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucent Intelligence Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ea; --surface: #fffdf8; --ink: #2c2c26; --ink-soft: #4a4c40;
    --border: #ddd6c1; --accent: #6d7a5c; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c16; --surface: #23241d; --ink: #efeee3; --ink-soft: #bcbcab;
      --border: #3a3b2f; --accent: #a3b48c; --accent-ink: #1c2114;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c16; --surface: #23241d; --ink: #efeee3; --ink-soft: #bcbcab;
    --border: #3a3b2f; --accent: #a3b48c; --accent-ink: #1c2114;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  h1 {
    font-family: "Fjalla One", sans-serif; font-weight: 400;
    font-size: clamp(24px, 5vw, 34px); letter-spacing: 0.01em; margin: 0 0 10px;
  }
  p { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .mono {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: block;
  }
</style>
</head>
<body>
<div>
  <span class="mono">Lucent Intelligence</span>
  <h1>Client Reports</h1>
  <p>Prepared, one-off snapshots for clinics we're actively talking with.</p>
</div>
</body>
</html>
